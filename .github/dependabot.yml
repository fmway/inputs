version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: "nix"
    directory: "/dev"
    schedule:
      interval: weekly
    allow:
      - dependency-name: nixpkgs
