name: daily-update
on:
  push:
    paths:
      - "dev/collections.json"
      - "dev/flake.nix"
    branches:
      - main
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract data from dev/collections.json
        id: setup
        run: |
          inputs="$(jq -r '[.[].inputName] | join(" ")' dev/collections.json)"
          substituters="$(jq -r '([.[] | .extraCaches.substituters // empty] | add // []) | unique | join(" ")' dev/collections.json)"
          keys="$(jq -r '([.[] | .extraCaches."trusted-public-keys" // empty] | add // []) | unique | join(" ")' dev/collections.json)"
          echo "substituters=$substituters" >> "$GITHUB_OUTPUT"
          echo "trusted-keys=$keys" >> "$GITHUB_OUTPUT"
          echo "inputs=$inputs" >> "$GITHUB_OUTPUT"

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16
        with:
          extra-conf: |
            experimental-features = nix-command flakes
            substituters = https://cache.nixos.org/ ${{ steps.setup.outputs.substituters }}
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= ${{ steps.setup.outputs.trusted-keys }}

      - name: Bump tagged inputs to their newest release
        run: |
          # TODO: support another platform
          while IFS=$'\t' read -r name repo; do
            ghrepo="${repo#https://github.com/}"
            latest="$(curl -fsSL "https://api.github.com/repos/${ghrepo}/releases/latest" | jq -r '.tag_name')"
            echo "$ghrepo/$latest (latest)"
            sed -i -E "s|(${name}\\.url *= *\"github:${ghrepo})(/[^\"]*)?\"|\1/${latest}\"|" dev/flake.nix
          done < <(jq -r 'to_entries[] | select(.value.tags == true) | [.value.inputName, .value.repo] | @tsv' dev/collections.json)

      - name: Update dev flake inputs
        run: nix flake update --flake path:./dev ${{ steps.setup.outputs.inputs }}

      - name: Refresh derivation data
        run: nix run ./dev#refresh

      - name: Publish data release & update data-lock
        run: nix run ./dev#publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Readme
        run: nix run ./dev#readme README.md

      - name: Update flake
        run: nix run ./dev#flake flake.nix

      - name: Commit & push if there are updates
        env:
          COMMIT_MESSAGE: "chore(inputs): refresh collection data"
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "fmway[bot]"
          git config user.email "fm18lv@gmail.com"
          git add -A
          if [ "$(git log -1 --format=%s)" = "$COMMIT_MESSAGE" ]; then
            # Squash into the previous identical bot commit instead of
            # stacking another one on top.
            echo "Amending previous identical commit"
            git commit --amend --no-edit
            git push --force-with-lease
          else
            git commit -m "$COMMIT_MESSAGE"
            git push
          fi
